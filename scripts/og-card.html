<!DOCTYPE html>
<!--
  Source of public/og-card.png, the image link previews show (og:image).
  Regenerate with scripts/og-card.sh after changing the name, headline,
  decode tokens or tagline in js/resume-data.js; everything on the card is
  read from there.

  It is the hero's decode frozen: the finished title, and under it every
  step's candidates at once instead of one popover at a time. Fixed at
  1200×630 and light only: the PNG is one picture shown on every feed,
  whatever theme the viewer runs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=block">
<style>
  :root {
    --paper:   #fafaf8;
    --paper-3: #ffffff;
    --ink:     #000000;
    --ink-2:   #3a3a3f;
    --ink-3:   #6a6a70;
    --accent:  #c1352b;
    --rule:    #e0dfd8;
    --rule-2:  #c6c5bc;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --text: 'Newsreader', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 72px 80px 0;
    display: grid;
    grid-template-columns: 196px 1fr;
    column-gap: 56px;
    align-content: start;
    /* the site's accent rule, as a band along the left edge */
    border-left: 14px solid var(--accent);
  }

  .photo {
    width: 196px;
    height: 196px;
    object-fit: cover;
    object-position: 50% 22%;
    border: 1px solid var(--rule-2);
  }

  .name {
    font-family: var(--mono);
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -.045em;
    line-height: 1.1;
    color: var(--ink);
  }
  .cred { color: var(--ink-3); font-weight: 400; }

  .title {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 58px;
    letter-spacing: -.03em;
    line-height: 1.15;
    color: var(--accent);
    white-space: pre;
  }
  .caret {
    display: inline-block;
    width: .5em;
    height: 1.02em;
    margin-left: .06em;
    background: var(--accent);
    vertical-align: -.16em;
  }

  /* The trace: one row per decoding step — the token that won, its meter,
     then the runners-up it beat. Same marks as the site's popover. */
  .trace {
    margin-top: 30px;
    display: grid;
    grid-template-columns: max-content 110px max-content max-content max-content;
    align-items: center;
    gap: 10px 20px;
    width: max-content;
    padding: 16px 22px;
    font-family: var(--mono);
    font-size: 23px;
    line-height: 1.3;
    background: var(--paper-3);
    border: 1px solid var(--rule-2);
  }
  .tok { white-space: pre; color: var(--ink); }
  .meter { height: 7px; background: var(--rule); }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .p { color: var(--ink); font-variant-numeric: tabular-nums; }
  .alt { white-space: pre; color: var(--ink-3); }
  .alt b { font-weight: 400; color: #9a9aa0; margin-left: .5ch; font-variant-numeric: tabular-nums; }

  .foot {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 56px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .tagline {
    font-family: var(--text);
    font-style: italic;
    font-size: 40px;
    line-height: 1;
    color: var(--ink-2);
  }
  .url {
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: -.02em;
    color: var(--ink-3);
  }
</style>
</head>
<body>
<div class="card" id="card"></div>

<script type="module">
  import { resume as r } from '../js/resume-data.js';

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // Tokens carry their leading space (" AI"); the trace reads better without it.
  const bare = (t) => esc(t.trim());

  // Same guard as decode.js: if the tokens no longer spell the headline, the
  // trace would be lying, so it is left off rather than printed wrong.
  const spells = Array.isArray(r.decode)
    && r.decode.map((s) => s.top[0]).join('') === r.headline[0];

  const trace = spells ? `
    <div class="trace" aria-hidden="true">
      ${r.decode.map(({ top: [tok, p], alt }) => `
        <span class="tok">${bare(tok)}</span>
        <span class="meter"><i style="width:${(p * 100).toFixed(0)}%"></i></span>
        <span class="p">${p.toFixed(2)}</span>
        ${alt.slice(0, 2).map(([t, q]) =>
          `<span class="alt">${bare(t)}<b>${q.toFixed(2)}</b></span>`).join('')}
      `).join('')}
    </div>` : '';

  document.getElementById('card').innerHTML = `
    <img class="photo" src="../${esc(r.photo.src)}" alt="">
    <div>
      <p class="name">${esc(r.name)}<span class="cred">, ${esc(r.credential)}</span></p>
      <p class="title">${esc(r.headline[0])}<span class="caret"></span></p>
      ${trace}
    </div>
    <div class="foot">
      <p class="tagline">${esc(r.tagline)}</p>
      <p class="url">pakhapoom.github.io</p>
    </div>`;

  // og-card.sh waits for this before taking the screenshot.
  await document.fonts.ready;
  await document.querySelector('.photo').decode().catch(() => {});
  document.documentElement.dataset.ready = '';
</script>
</body>
</html>
