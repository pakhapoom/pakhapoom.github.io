<button class="chat-launcher" id="chat-launcher" type="button" aria-expanded="false" aria-controls="chat-panel">

    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>

        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-atomic="false"></div>

  <div class="chat-suggest" id="chat-suggest"></div>

  <form class="chat-form" id="chat-form">
    <label class="visually-hidden" for="chat-input">Your question</label>
    <textarea class="chat-input" id="chat-input" rows="1" placeholder="Ask about experience, skills, research…" autocomplete="off"></textarea>
    <button class="chat-send" id="chat-send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
